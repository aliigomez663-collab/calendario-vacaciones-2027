<body>

<div class="container">

<h1>📅 Calendario Vacaciones 2027</h1>

<p>Conectado a Firebase</p>

<br><br>

<br><br>

<button id="btnTest">
Registrar vacaciones
</button>

<div id="resultado"></div>

<h2>📊 Resumen</h2>

</div>
